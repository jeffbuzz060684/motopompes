          ["KESTREL — limites", "Utilisation −15 °C à +50 °C · stockage −30 °C à +80 °C · étanche à 1 m et flotte · chute maximum 2 m"],
          ["E/R portatif VHF marine ICOM M87", "Communications sur les réseaux ANTARES et VHF marine"]
        ]
      }
    ],
    source: "Formation CHEF D'ÉQUIPE DIH — Connaissances essentielles (PDF, 13 pages, BMPM/SOS HELI, août 2019)"
  }
];

var STORE_KEY = "motopompes-checks-v1";
var APP_VERSION = "v2";

/* ---------- utilitaires ---------- */
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function loadChecks() {
  try {
    var raw = localStorage.getItem(STORE_KEY);
    if (!raw) return {};
    var o = JSON.parse(raw);
    return (o && typeof o === "object") ? o : {};
  } catch (e) { return {}; }
}
function saveChecks(o) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(o)); } catch (e) {}
}
function listKey(pumpId, list) { return pumpId + ":" + list; }
function isDone(checks, pumpId, list, i) {
  var l = checks[listKey(pumpId, list)];
  return !!(l && l[i]);
}
function toggleCheck(checks, pumpId, list, i) {
  var k = listKey(pumpId, list);
  var l = checks[k] || {};
  l[i] = !l[i];
  if (!l[i]) delete l[i];
  checks[k] = l;
  return checks;
}
function resetList(checks, pumpId, list) {
  delete checks[listKey(pumpId, list)];
  return checks;
}
function countDone(checks, pumpId, list, total) {
  var l = checks[listKey(pumpId, list)];
  var n = 0;
  if (l) { for (var i = 0; i < total; i++) { if (l[i]) n++; } }
  return n;
}
function progressPct(count, total) {
  if (!total) return 0;
  return Math.round((count / total) * 1000) / 10;
}

/* ---------- rendu ---------- */
function stepsHtml(pump, list, steps, checks) {
  var done = 0;
  var lis = steps.map(function (s, i) {
    var isD = isDone(checks, pump.id, list, i);
    if (isD) done++;
    var warn = s.warn ? " warn" : "";
    var d = s.d ? '<span class="d">' + esc(s.d) + "</span>" : "";
    return '<li><button type="button" data-check="' + esc(pump.id) + "|" + list + "|" + i + '" class="' + (isD ? "done" : "") + '">' +
      '<span class="num">' + (isD ? "✓" : (i + 1)) + "</span>" +
      '<span><span class="t' + warn + '">' + (s.warn ? "⚠ " : "") + esc(s.t) + "</span>" + d + "</span></button></li>";
  }).join("");
  var pct = progressPct(done, steps.length);
  var msg = done === steps.length ? '<div class="done-msg">✅ Procédure terminée</div>' : "";
  return '<div class="bar"><div class="track"><div class="fill" style="width:' + pct + "%;background:" + pump.acc + '"></div></div>' +
    '<span class="n">' + done + "/" + steps.length + "</span>" +
    '<button type="button" data-reset="' + esc(pump.id) + "|" + list + '">↺ Réinitialiser</button></div>' +
    '<ol class="steps">' + lis + "</ol>" + msg;
}
function specHtml(specs) {
  return '<div class="spec">' + specs.map(function (kv) {
    return '<div class="row"><div class="k">' + esc(kv[0]) + '</div><div class="v">' + esc(kv[1]) + "</div></div>";
  }).join("") + "</div>";
}
function bulletsHtml(items) {
  return '<ul class="blt">' + items.map(function (t) { return "<li>" + esc(t) + "</li>"; }).join("") + "</ul>";
}
function tableHtml(sec) {
  var h = '<div class="cmp"><table><thead><tr>' + sec.head.map(function (c) {
    return '<th class="l">' + esc(c) + "</th>";
  }).join("") + "</tr></thead><tbody>" +
    sec.rows.map(function (r) {
      return "<tr>" + r.map(function (c) { return "<td>" + esc(c) + "</td>"; }).join("") + "</tr>";
    }).join("") + "</tbody></table></div>";
  if (sec.note) h += '<p class="note">' + esc(sec.note) + "</p>";
  return h;
}
function signsHtml(signs) {
  return signs.map(function (s) {
    return '<div class="sign"><span class="code">' + esc(s[0]) + '</span><span class="sg">' + esc(s[1]) + "</span></div>";
  }).join("");
}
function sectionHtml(doc, sec, checks) {
  var h = '<div class="card"><h3><span class="sq" style="background:' + doc.acc + '"></span>' + sec.icon + " " + esc(sec.title) + "</h3>";
  if (sec.intro) h += '<p class="intro">' + esc(sec.intro) + "</p>";
  if (sec.type === "steps") h += stepsHtml(doc, sec.list, sec.steps, checks);
  else if (sec.type === "bullets") h += bulletsHtml(sec.items);
  else if (sec.type === "spec") h += specHtml(sec.items);
  else if (sec.type === "table") h += tableHtml(sec);
  else if (sec.type === "signs") { h += signsHtml(sec.signs); if (sec.note) h += '<p class="note">' + esc(sec.note) + "</p>"; }
  h += "</div>";
  return h;
}
function docHtml(doc, checks) {
  var h = '<div class="head-card" style="border-color:' + doc.acc + "55;background:" + doc.acc + '1a">' +
    '<div class="em">' + doc.emoji + '</div><div><h2>' + esc(doc.name) + "</h2><p>" + esc(doc.subtitle) + "</p></div></div>";
  doc.sections.forEach(function (sec) { h += sectionHtml(doc, sec, checks); });
  h += '<p class="src">Source : ' + esc(doc.source) + "</p>";
  return h;
}
function pumpHtml(pump, checks) {
  var h = '<div class="head-card" style="border-color:' + pump.acc + "55;background:" + pump.acc + '1a">' +
    '<div class="em">' + pump.emoji + '</div><div><h2>' + esc(pump.name) + "</h2><p>" + esc(pump.subtitle) + "</p></div></div>";
  if (pump.fuelNote) {
    h += '<div class="fuel" style="border-color:' + pump.acc + '66;background:' + pump.acc + '17;color:' + pump.acc + '">🛢 ' + esc(pump.fuelNote) + "</div>";
  }
  h += '<div class="card"><h3><span class="sq" style="background:' + pump.acc + '"></span>📋 Fiche technique</h3>' + specHtml(pump.specs) + "</div>";
  h += '<div class="card"><h3><span class="sq" style="background:' + pump.acc + '"></span>🚀 Procédure de démarrage</h3>' +
    stepsHtml(pump, "start", pump.start, checks) + "</div>";
  if (pump.stop) {
    h += '<div class="card"><h3><span class="sq" style="background:' + pump.acc + '"></span>⏹ Arrêt</h3>' +
      stepsHtml(pump, "stop", pump.stop, checks) + "</div>";
  }
  if (pump.controls) {
    h += '<div class="card"><h3><span class="sq" style="background:' + pump.acc + '"></span>🎛 Commandes &amp; alarmes</h3><div class="ctrls">' +
      pump.controls.map(function (c) {
        return '<div class="ctrl"><span class="b" style="background:' + pump.acc + '">' + esc(c[0]) + '</span><span>' + esc(c[1]) + "</span></div>";
      }).join("") + "</div></div>";
  }
  if (pump.del) {
    h += '<div class="card"><h3><span class="sq" style="background:' + pump.acc + '"></span>💡 États du témoin DEL</h3>' +
      pump.del.map(function (r) {
        return '<div class="delrow"><span class="led" style="background:' + r[2] + '">LED</span><div><div class="st">' + esc(r[0]) + '</div><div class="mg">' + r[1] + "</div></div></div>";
      }).join("") + "</div>";
  }
  if (pump.entretien) {
    h += '<div class="card"><h3><span class="sq" style="background:' + pump.acc + '"></span>🔧 Entretien &amp; remisage</h3>' + bulletsHtml(pump.entretien) + "</div>";
  }
  if (pump.extra) {
    h += '<div class="card"><h3><span class="sq" style="background:' + pump.acc + '"></span>📌 Points clés</h3>' + bulletsHtml(pump.extra) + "</div>";
  }
  h += '<p class="src">Source : ' + esc(pump.source) + "</p>";
  return h;
}
function compareHtml() {
  var maxD = 0;
  COMPARE.forEach(function (c) { if (c.debit > maxD) maxD = c.debit; });
  var accOf = {};
  PUMPS.forEach(function (p) { accOf[p.id] = p.acc; });
  var bars = COMPARE.map(function (c) {
    var w = Math.max((c.debit / maxD) * 100, 12);
    return '<div class="cmpline"><span class="lbl">' + esc(c.name) + '</span><div class="btrack"><div class="bfill" style="width:' + w + "%;background:" + accOf[c.id] + '">' + esc(c.debitLabel) + "</div></div></div>";
  }).join("");
  var table = '<table><thead><tr><th class="l"></th>' + PUMPS.map(function (p) {
    return "<th>" + esc(p.name) + "</th>";
  }).join("") + "</tr></thead><tbody>" +
    CMP_ROWS.map(function (r) {
      return "<tr><td>" + esc(r[0]) + "</td>" + r.slice(1).map(function (c) { return "<td>" + esc(c) + "</td>"; }).join("") + "</tr>";
    }).join("") + "</tbody></table>";
  return '<div class="card"><h3><span class="sq" style="background:#f97316"></span>📊 Débit max.</h3>' + bars +
    '<p class="note">Pression max. : MARK 3 → 26,2 bars · TOHATSU → 16 bars · FYR PAK → 13 bars · EFP-500-FL → élévation max. 95 m.</p></div>' +
    '<div class="card"><h3><span class="sq" style="background:#0ea5e9"></span>⚖️ Tableau comparatif</h3><div class="cmp">' + table + "</div></div>" +
    '<div class="card"><h3><span class="sq" style="background:#ef4444"></span>⚠ Règles carburant à ne jamais confondre</h3>' + bulletsHtml(FUEL_RULES) + "</div>";
}

/* ---------- app ---------- */
var state = { tab: "reflexe" };
var checks = loadChecks();

function render() {
  var app = document.getElementById("app");
  if (!app) return;
  var tabs = DOCS.map(function (d) {
    return '<button type="button" class="tab' + (state.tab === d.id ? " active" : "") + '" data-tab="' + esc(d.id) + '">' + d.emoji + " " + esc(d.tabName) + "</button>";
  }).join("") + PUMPS.map(function (p) {
    return '<button type="button" class="tab' + (state.tab === p.id ? " active" : "") + '" data-tab="' + esc(p.id) + '">' + p.emoji + " " + esc(p.name) + "</button>";
  }).join("") + '<button type="button" class="tab' + (state.tab === "compare" ? " active" : "") + '" data-tab="compare">📊 Comparatif</button>';
  var body;
  if (state.tab === "compare") {
    body = compareHtml();
  } else {
    var doc = DOCS.filter(function (d) { return d.id === state.tab; })[0];
    var pump = PUMPS.filter(function (p) { return p.id === state.tab; })[0];
    body = doc ? docHtml(doc, checks) : (pump ? pumpHtml(pump, checks) : "");
  }
  app.innerHTML = '<nav>' + tabs + "</nav>" + body;
}

function onClick(e) {
  var t = e.target;
  while (t && t !== document.body) {
    if (t.getAttribute) {
      var tab = t.getAttribute("data-tab");
      if (tab) { state.tab = tab; render(); return; }
      var chk = t.getAttribute("data-check");
      if (chk) {
        var parts = chk.split("|");
        toggleCheck(checks, parts[0], parts[1], parseInt(parts[2], 10));
        saveChecks(checks);
        render();
        return;
      }
      var rst = t.getAttribute("data-reset");
      if (rst) {
        var rp = rst.split("|");
        resetList(checks, rp[0], rp[1]);
        saveChecks(checks);
        render();
        return;
      }
    }
    t = t.parentNode;
  }
}

function loadVersion() {
  var el = document.getElementById("ver");
  if (!el || typeof fetch !== "function") return;
  fetch("version.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (v) {
    if (v && v.version) el.textContent = "💾 Hors ligne · " + v.version;
  }).catch(function () {});
}

function main() {
  render();
  loadVersion();
  var app = document.getElementById("app");
  if (app && app.addEventListener) app.addEventListener("click", onClick);
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js").catch(function () {});
  }
  if (navigator.storage && navigator.storage.persist) {
    try { navigator.storage.persist(); } catch (e) {}
  }
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", main);
else main();

/* exposition pour les tests */
window.__MOTO = {
  PUMPS: PUMPS, COMPARE: COMPARE, CMP_ROWS: CMP_ROWS, FUEL_RULES: FUEL_RULES,
  DOCS: DOCS,
  esc: esc, loadChecks: loadChecks, toggleCheck: toggleCheck, resetList: resetList,
  isDone: isDone, countDone: countDone, progressPct: progressPct,
  pumpHtml: pumpHtml, compareHtml: compareHtml, stepsHtml: stepsHtml,
  docHtml: docHtml, sectionHtml: sectionHtml, tableHtml: tableHtml, signsHtml: signsHtml,
  state: state, STORE_KEY: STORE_KEY, APP_VERSION: APP_VERSION, loadVersion: loadVersion
};
</script>
</body>
</html>
